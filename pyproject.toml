[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-log-analyzer"
version = "0.1.0"
description = "Ingest logs, group and classify errors, search them, and explain them with an LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["ruff>=0.5", "mypy>=1.10"]

[project.scripts]
logan = "log_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
log_analyzer = ["py.typed"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# These files are tables of regular expressions. Wrapping them would make them harder to read.
"src/log_analyzer/classifier.py" = ["E501"]
"src/log_analyzer/redact.py" = ["E501"]
"src/log_analyzer/fingerprint.py" = ["E501"]
"src/log_analyzer/parsers.py" = ["E501"]
"tests/*" = ["E501"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"
